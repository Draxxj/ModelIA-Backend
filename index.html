<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ModelIA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    min-height:100vh;
    background:
        linear-gradient(
            135deg,
            #050816,
            #0f172a,
            #1e1b4b
        );
    color:white;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:48px;
    color:#60a5fa;
}

.logo p{
    color:#94a3b8;
    margin-top:10px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

.card h2{
    color:#60a5fa;
    margin-bottom:15px;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#111827;
    color:white;
}

textarea{
    height:150px;
    resize:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.criar{
    background:#2563eb;
}

.gerar{
    background:#7c3aed;
}

.sair{
    background:#ef4444;
}

.download{
    display:block;
    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    background:#16a34a;
    color:white;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.preview{
    width:100%;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

.resultado{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#111827;
    line-height:1.6;
}

.projeto{
    background:#111827;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

.status{
    text-align:center;
    margin-top:10px;
    color:#22c55e;
    font-size:14px;
}

.barra{
    width:100%;
    height:10px;
    background:#374151;
    border-radius:10px;
    margin-top:15px;
    overflow:hidden;
}

.progresso{
    height:100%;
    width:0%;
    background:#7c3aed;
    transition:width 0.5s;
}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     LOGIN
======================================= -->

<div id="login">

    <div class="logo">

        <h1>ModelIA</h1>

        <p>
            Crie modelos 3D usando IA
        </p>

        <div class="status">
            ● Backend conectado
        </div>

    </div>


    <div class="card">

        <h2>Criar Conta</h2>


        <input
            id="email"
            type="email"
            placeholder="Seu email"
        >


        <input
            id="senha"
            type="password"
            placeholder="Sua senha"
        >


        <button
            class="criar"
            onclick="criarConta()"
        >

            Criar Conta

        </button>

    </div>

</div>



<!-- ======================================
     APLICATIVO
======================================= -->

<div
    id="app"
    style="display:none;"
>


    <div class="logo">

        <h1>ModelIA</h1>

        <p id="usuario"></p>

    </div>



    <!-- ==================================
         IMAGEM
    =================================== -->

    <div class="card">

        <h2>
            Imagem de Referência
        </h2>


        <input
            id="imagem"
            type="file"
            accept="image/*"
            onchange="mostrarImagem(event)"
        >


        <img
            id="preview"
            class="preview"
        >

    </div>



    <!-- ==================================
         DESCRIÇÃO
    =================================== -->

    <div class="card">

        <h2>
            Descreva o Modelo 3D
        </h2>


        <textarea
            id="descricao"
            placeholder="Ex: Pinheiro gigante, velho, sombrio e grotesco"
        ></textarea>


        <button
            id="botaoGerar"
            class="gerar"
            onclick="gerarModelo()"
        >

            🤖 Gerar Modelo 3D

        </button>


        <div
            id="resultado"
            class="resultado"
        >

            Aguardando descrição...

        </div>


        <div
            id="barraContainer"
            style="display:none;"
        >

            <div class="barra">

                <div
                    id="progresso"
                    class="progresso"
                ></div>

            </div>

        </div>

    </div>



    <!-- ==================================
         HISTÓRICO
    =================================== -->

    <div class="card">

        <h2>
            Projetos Recentes
        </h2>


        <div id="historico"></div>

    </div>



    <!-- ==================================
         SAIR
    =================================== -->

    <div class="card">

        <button
            class="sair"
            onclick="sair()"
        >

            Sair

        </button>

    </div>

</div>


</div>



<script>


/* =========================================
   ENDEREÇO DO BACKEND
========================================= */

const API_URL =
    "https://modelia-backend.onrender.com";


/* =========================================
   HISTÓRICO
========================================= */

let historico = [];


/* =========================================
   CRIAR CONTA
========================================= */

function criarConta(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const senha =
        document
        .getElementById("senha")
        .value
        .trim();


    if(
        email === "" ||
        senha === ""
    ){

        alert(
            "Preencha email e senha."
        );

        return;
    }


    document
        .getElementById("usuario")
        .innerText =
        "Conta: " + email;


    document
        .getElementById("login")
        .style.display =
        "none";


    document
        .getElementById("app")
        .style.display =
        "block";

}



/* =========================================
   SAIR
========================================= */

function sair(){

    document
        .getElementById("app")
        .style.display =
        "none";


    document
        .getElementById("login")
        .style.display =
        "block";

}



/* =========================================
   MOSTRAR IMAGEM
========================================= */

function mostrarImagem(event){

    const arquivo =
        event.target.files[0];


    if(!arquivo){

        return;

    }


    const preview =
        document
        .getElementById("preview");


    preview.src =
        URL.createObjectURL(
            arquivo
        );


    preview.style.display =
        "block";

}



/* =========================================
   GERAR MODELO
========================================= */

async function gerarModelo(){

    const descricao =
        document
        .getElementById("descricao")
        .value
        .trim();


    const resultado =
        document
        .getElementById("resultado");


    const botao =
        document
        .getElementById("botaoGerar");


    const barraContainer =
        document
        .getElementById("barraContainer");


    const progresso =
        document
        .getElementById("progresso");


    if(descricao === ""){

        alert(
            "Digite uma descrição para o modelo."
        );

        return;

    }


    /*
        Bloqueia o botão
    */

    botao.disabled =
        true;


    botao.innerText =
        "⏳ Gerando modelo...";


    resultado.innerHTML =
        "🤖 Enviando descrição para o ModelIA...";


    barraContainer.style.display =
        "block";


    progresso.style.width =
        "5%";


    try{


        /* =================================
           ENVIAR PARA O BACKEND
        ================================= */

        const resposta =
            await fetch(
                API_URL +
                "/api/generate",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        descricao:
                            descricao

                    })

                }
            );


        const dados =
            await resposta.json();


        if(
            !resposta.ok ||
            !dados.task_id
        ){

            throw new Error(
                dados.mensagem ||
                "Não foi possível criar a tarefa."
            );

        }


        /*
            Tarefa criada
        */

        resultado.innerHTML =
            "🤖 Modelo enviado para geração.<br><br>" +
            "⏳ Aguarde enquanto a IA cria seu modelo 3D...";


        progresso.style.width =
            "10%";


        /*
            Começar acompanhamento
        */

        await acompanharTarefa(
            dados.task_id,
            descricao
        );


    }
    catch(erro){

        console.error(
            erro
        );


        resultado.innerHTML =
            "❌ Erro:<br><br>" +
            erro.message;


        botao.disabled =
            false;


        botao.innerText =
            "🤖 Gerar Modelo 3D";

    }

}



/* =========================================
   ACOMPANHAR TAREFA
========================================= */

async function acompanharTarefa(
    taskId,
    descricao
){

    const resultado =
        document
        .getElementById("resultado");


    const botao =
        document
        .getElementById("botaoGerar");


    const progresso =
        document
        .getElementById("progresso");


    /*
        Limite de tentativas
    */

    const maxTentativas =
        120;


    for(
        let tentativa = 0;
        tentativa < maxTentativas;
        tentativa++
    ){

        try{


            /*
                Esperar 5 segundos
            */

            await esperar(
                5000
            );


            /*
                Consultar backend
            */

            const resposta =
                await fetch(

                    API_URL +
                    "/api/task/" +
                    encodeURIComponent(
                        taskId
                    )

                );


            const dados =
                await resposta.json();


            if(!resposta.ok){

                throw new Error(
                    dados.mensagem ||
                    "Erro ao consultar tarefa."
                );

            }


            /*
                Progresso
            */

            let porcentagem =
                Number(
                    dados.progress
                ) || 0;


            if(porcentagem > 0){

                progresso.style.width =
                    Math.min(
                        porcentagem,
                        100
                    ) + "%";

            }


            /*
                STATUS
            */

            if(
                dados.status ===
                "queued"
            ){

                resultado.innerHTML =
                    "⏳ Na fila para geração...";

            }


            else if(
                dados.status ===
                "running"
            ){

                resultado.innerHTML =
                    "🤖 A IA está criando seu modelo 3D...<br><br>" +
                    "Progresso: " +
                    porcentagem +
                    "%";

            }


            /*
                FINALIZADO
            */

            else if(
                dados.status ===
                "success"
            ){

                progresso.style.width =
                    "100%";


                resultado.innerHTML =
                    "🎉 <strong>Modelo 3D criado!</strong><br><br>" +
                    "Seu modelo foi gerado com sucesso.";


                /*
                    Procurar URL do modelo
                */

                const url =
                    encontrarUrl(
                        dados.output
                    );


                if(url){

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        url;


                    link.target =
                        "_blank";


                    link.rel =
                        "noopener";


                    link.className =
                        "download";


                    link.innerText =
                        "⬇️ Abrir / Baixar Modelo 3D";


                    resultado.appendChild(
                        link
                    );

                }
                else{

                    resultado.innerHTML +=
                        "<br><br>" +
                        "Modelo criado, mas o endereço do arquivo não foi encontrado na resposta.";

                }


                /*
                    Histórico
                */

                historico.push(
                    descricao
                );


                atualizarHistorico();


                botao.disabled =
                    false;


                botao.innerText =
                    "🤖 Gerar Modelo 3D";


                return;

            }


            /*
                FALHA
            */

            else if(
                dados.status ===
                "failed"
            ){

                throw new Error(
                    "O Tripo não conseguiu gerar o modelo."
                );

            }

        }
        catch(erro){

            console.error(
                erro
            );


            resultado.innerHTML =
                "❌ " +
                erro.message;


            botao.disabled =
                false;


            botao.innerText =
                "🤖 Gerar Modelo 3D";


            return;

        }

    }


    /*
        Tempo máximo
    */

    resultado.innerHTML =
        "⏰ A geração demorou mais do que o esperado. " +
        "Você pode tentar novamente.";


    botao.disabled =
        false;


    botao.innerText =
        "🤖 Gerar Modelo 3D";

}



/* =========================================
   ENCONTRAR URL
========================================= */

function encontrarUrl(output){

    if(!output){

        return null;

    }


    /*
        Alguns retornos possuem
        diferentes estruturas.
    */


    if(
        typeof output ===
        "string"
    ){

        return output;

    }


    if(
        output.model
    ){

        return output.model;

    }


    if(
        output.pbr_model
    ){

        return output.pbr_model;

    }


    if(
        output.base_model
    ){

        return output.base_model;

    }


    if(
        output.glb
    ){

        return output.glb;

    }


    if(
        output.model_url
    ){

        return output.model_url;

    }


    return null;

}



/* =========================================
   ESPERAR
========================================= */

function esperar(
    milissegundos
){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                milissegundos
            );

        }
    );

}



/* =========================================
   HISTÓRICO
========================================= */

function atualizarHistorico(){

    const area =
        document
        .getElementById("historico");


    area.innerHTML =
        "";


    historico.forEach(
        function(item){

            const projeto =
                document.createElement(
                    "div"
                );


            projeto.className =
                "projeto";


            projeto.innerText =
                "🌐 " + item;


            area.appendChild(
                projeto
            );

        }
    );

}

</script>

</body>

    </html>
